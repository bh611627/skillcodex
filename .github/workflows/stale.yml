name: Mark stale issues and PRs
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: This issue has been inactive for 30 days and will be closed in 14 days if there is no further activity.
          stale-pr-message: This pull request has been inactive for 30 days and will be closed in 14 days if there is no further activity.
          close-issue-message: Closed due to inactivity. Reopen if this is still relevant.
          close-pr-message: Closed due to inactivity. Reopen if this is still relevant.
          days-before-stale: 30
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
