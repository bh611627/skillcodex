name: Publish to npm
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd package && pnpm run validate
      - run: cd package && pnpm run build
      - run: cd package && pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Post release summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const indexPath = path.join('package', 'skills-index.json');
            let body = '## Published @skillcodex/skills\n\n';
            if (fs.existsSync(indexPath)) {
              const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
              body += '| Skill | Version | Risk |\n|-------|---------|------|\n';
              for (const s of index.skills) {
                body += `| ${s.slug} | ${s.version ?? '-'} | ${s.risk_level ?? '-'} |\n`;
              }
            } else {
              body += '_skills-index.json not found_\n';
            }
            const changelogPath = path.join('package', 'CHANGELOG_AUTO.md');
            if (fs.existsSync(changelogPath)) {
              body += '\n### Changes since last tag\n\n';
              body += fs.readFileSync(changelogPath, 'utf8');
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: context.payload.release.body
                ? context.payload.release.body + '\n\n' + body
                : body,
            });
